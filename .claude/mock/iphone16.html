<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone 16 モック</title>
<style>
  :root{--bg:#d9d6d0;--ink:#24221f;--muted:#6f6a63;--bezel:#1b1b1d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN",system-ui,sans-serif;padding:32px 28px 60px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.04em}
  .lead{margin:0 0 28px;color:var(--muted);font-size:13px}
  h2{font-size:14px;letter-spacing:.08em;margin:36px 0 14px;color:var(--muted);font-weight:500}
  .row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
  figcaption{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
  figcaption b{color:var(--ink);font-weight:600;margin-right:6px}
  /* iPhone 16：393 × 852pt を 0.62 倍で表示 */
  .phone{--s:.62;width:calc(393px * var(--s) + 20px);height:calc(852px * var(--s) + 20px);
    padding:10px;border-radius:52px;background:var(--bezel);position:relative;
    box-shadow:0 0 0 2px #3a3a3d, 0 24px 48px -16px rgba(0,0,0,.45)}
  .screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;background:#000}
  /* ステータスバー 54pt の下にページを表示 */
  .screen{display:flex;flex-direction:column}
  .status{flex:none;height:calc(54px * var(--s));background:#17161a;color:#fff;font-size:10px;font-weight:600;
    display:flex;align-items:center;padding:6px 26px 0;position:relative}
  .status::after{content:"";position:absolute;right:24px;top:50%;width:16px;height:7px;border:1px solid #fff;border-radius:2px;transform:translateY(-20%)}
  .screen iframe{width:393px;height:798px;border:0;transform:scale(var(--s));transform-origin:0 0;display:block;flex:none}
  .island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:76px;height:22px;border-radius:12px;background:#000;z-index:2}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;margin-right:6px;letter-spacing:.06em}
  .before{background:#f1d9d3;color:#8a3b2a}
  .after{background:#dbe8d6;color:#355a2a}
</style>
</head>
<body>
<h1>スマホ最適化モック（iPhone 16・393 × 852）</h1>
<p class="lead">中身はローカルの実ページを iPhone 16 の画面幅で読み込んだものです。各画面の中はスクロールできます。</p>

<h2>修正前 / 修正後（ミッション）</h2>
<div class="row">
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/.claude/mock/before/index.html" data-target="#mission"></iframe></div></div>
    <figcaption><span class="tag before">修正前</span>現在の本番（main）：左右の余白が 0</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target="#mission"></iframe></div></div>
    <figcaption><span class="tag after">修正後</span>左右 22px の余白・本文 15px</figcaption></figure>
</div>

<h2>修正後の各画面</h2>
<div class="row">
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/"></iframe></div></div>
    <figcaption><b>1</b>ファーストビュー</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-menu="1"></iframe></div></div>
    <figcaption><b>2</b>メニュー（全画面シート）</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target=".glyph"></iframe></div></div>
    <figcaption><b>3</b>マークの説明</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target="#business"></iframe></div></div>
    <figcaption><b>4</b>事業（角丸カード）</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target="#team"></iframe></div></div>
    <figcaption><b>5</b>経営体制</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target="#company"></iframe></div></div>
    <figcaption><b>6</b>会社概要</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target="#contact"></iframe></div></div>
    <figcaption><b>7</b>お問い合わせフォーム</figcaption></figure>
  <figure><div class="phone"><div class="screen"><span class="island"></span><div class="status">9:41</div><iframe data-src="/" data-target=".site-foot"></iframe></div></div>
    <figcaption><b>8</b>フッター</figcaption></figure>
</div>

<script>
  // 同一オリジンの画面は、読み込み後に対象位置へスクロール／メニューを開く
  document.querySelectorAll('iframe[data-src]').forEach(function(f){
    f.addEventListener('load', function(){
      var w; try { w = f.contentWindow; w.document; } catch(e){ return; }
      var d = w.document;
      d.documentElement.style.scrollBehavior = 'auto';
      var st = d.createElement('style'); st.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{display:none}'; d.head.appendChild(st);
      if(f.dataset.target){
        var el = d.querySelector(f.dataset.target);
        if(el){ w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 76); }
      }
      if(f.dataset.menu){ d.getElementById('menuBtn').click(); }
    });
    f.src = f.dataset.src;
  });
</script>
</body>
</html>
